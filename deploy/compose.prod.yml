# Self-hosted VPS deploy of the mytheus-backend modular monolith + its data stores.
#
# Resolved infra decision (§8): self-host on the existing VPS rather than Railway/Render. The
# service seams stay real (16-deployment §3.1); this just co-locates them in one deployable on one
# box (srv1804132, 187.127.190.246). One backend image runs three roles (web / relay / workflow);
# Postgres, Redis, and Redpanda (+ Schema Registry) are self-hosted here. Per-store split is
# confirmed at deploy time: point DATABASE_URL at the local `postgres` service OR a managed
# Supabase Postgres by editing env/prod.env — nothing else changes.
#
# SECRETS ARE NOT IN THIS REPO. The env/*.env files and postgres-init/prod-bootstrap.sql are
# gitignored, so they exist only on the deployment host. Every path to them is therefore a
# variable with a working default:
#
#   MYTHEUS_ENV_DIR   directory holding prod.env + the three per-role prod.db.*.env files
#   MYTHEUS_PG_INIT   path to the postgres post-init hook
#
# The defaults are absolute, and specifically under /etc/dokploy/mytheus-secrets, for a
# reason that is not obvious and cost a long debugging session.
#
# Dokploy runs `docker compose` INSIDE the dokploy container, with the docker socket bind
# mounted. The compose CLI therefore resolves every env_file path against the CONTAINER's
# filesystem, while the resulting containers are created on the host daemon. /srv is not
# mounted into that container, so an env_file under /srv resolves to nothing there - and
# because these entries are `required: false` (so a checkout without secrets still renders)
# nothing errors. compose emits services with an empty environment and the backend starts
# with no DATABASE_URL, surfacing only as `migrate` dying on KeyError: 'DATABASE_URL'.
#
# Running the identical command by hand on the host succeeds, which is what makes this so
# misleading: the host's compose sees /srv, the container's does not. The give-away is that
# the two report different compose versions.
#
# /etc/dokploy is bind mounted into the dokploy container at the SAME path, so paths under it
# resolve identically in both namespaces. That matters twice over: env_file is read by the
# compose CLI (container side), while the MYTHEUS_PG_INIT bind mount below is handed to the
# docker daemon as a host path (host side). Only a path valid in both can satisfy both.
#
# Secrets stay on the host and are never copied into Dokploy's database, so re-cloning cannot
# destroy them and no credential is duplicated into another system's storage. Override both
# variables to deploy anywhere else.
#
# Bring up:  POSTGRES_PASSWORD=... docker compose -f compose.prod.yml up -d
# Validate:  docker compose -f compose.prod.yml config

name: mytheus

# Shared, NON-DATABASE config only. Defect D1 had two halves: the application connected as a
# role that bypasses RLS, and this one anchor handed the same env_file to migrate, web, relay
# and workflow, so splitting the roles would have achieved nothing while every process could
# still read every credential. The database URL now comes from a per-role file layered on top
# of this one, so the web process has no way to obtain the migrate or operator credential.
x-backend: &backend
  # Pulled, never built here. The `build: context: ../../mytheus-backend` this replaces
  # required a second repo checked out as a sibling of this one, which is why the stack could
  # only ever be deployed by hand on a box where someone had arranged that layout: any deploy
  # tool clones ONE repo and the relative path resolves to nothing. It also meant the running
  # image existed nowhere but the machine that built it, so a rebuild was not reproducible and
  # a rollback had nothing to roll back to.
  #
  # mytheus-backend's CI now publishes this image (ci.yml, `docker` job). `main` follows the
  # branch; pin BACKEND_IMAGE to a `:<sha>` tag to hold a specific build or roll back.
  image: ${BACKEND_IMAGE:-ghcr.io/mytheus-ai/mytheus-backend:main}
  pull_policy: always
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
      required: false
  restart: unless-stopped

# The request path: `mytheus_app`, subject to every tenant_isolation policy.
x-backend-app: &backend-app
  <<: *backend
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
      required: false
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.app.env
      required: false

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    # POSTGRES_PASSWORD arrives via env_file, NOT `${POSTGRES_PASSWORD}` interpolation.
    # Interpolation cannot read an env_file: it resolves from the shell or the project .env
    # before compose parses anything. So an interpolated superuser password has to be handed
    # to whatever runs the deploy, and Dokploy stores env in its database and serves it back
    # in plaintext to any holder of an API key. Reading it from the host file instead keeps
    # the strongest credential in the stack out of that blast radius.
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
    volumes:
      # Path is a variable for the same reason MYTHEUS_ENV_DIR is: this file holds the postgres
      # password, so it is gitignored and absent from any fresh clone. Left as a bare relative
      # path, a deploy-tool checkout resolves it to nothing and Docker silently creates an empty
      # DIRECTORY at the mount point. That is invisible today because the hook only runs against
      # an uninitialised data directory and pgdata already exists, but it would break the first
      # boot on a new volume, which is the one moment it has to work.
      - ${MYTHEUS_PG_INIT:-/etc/dokploy/mytheus-secrets/prod-bootstrap.sql}:/etc/postgresql.schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    # Its own one-line env file rather than prod.env, for the same reason the backend roles
    # each get their own: temporal needs exactly one secret (the postgres password, under the
    # name POSTGRES_PWD that this image expects) and handing it prod.env would also hand it
    # every Clerk, Stripe and LiveKit credential it has no business holding.
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.temporal.env
        required: false
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: apply migrations, then give the three roles their passwords. The migration
  # creates them without one on purpose, so bootstrap_roles must run before `web` starts or
  # nothing can authenticate. This is the ONLY process holding the schema-owner credential
  # and the only one holding the role passwords.
  migrate:
    <<: *backend
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.migrate.env
        required: false
    command:
      - sh
      - -c
      - "alembic -c migrations/alembic.ini upgrade head && python -m scripts.bootstrap_roles"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *backend-app
    # Aliased to `core-api` because that is the canonical service name the gateway's ROUTE_MAP
    # resolves (`http://core-api:8000`). Kept as the service key `web` rather than renamed so
    # the container is not recreated and Caddy's existing `web:8000` upstream keeps working
    # during the cutover; both names resolve on the network.
    networks:
      default:
        aliases: ["core-api"]
    command: ["uvicorn", "services.core_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  # The ONLY sanctioned producer: drains the transactional outbox to Redpanda. Runs as
  # `mytheus_relay`, whose single permissive `outbox_relay_drain` policy on `outbox` is what
  # lets it read across tenants without BYPASSRLS. Running it as `mytheus_app` would drain
  # nothing at all and report an empty queue forever (defect D4).
  relay:
    <<: *backend
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.relay.env
        required: false
    command: ["python", "-m", "services.relay.main"]
    depends_on:
      web:
        condition: service_started
      redpanda:
        condition: service_healthy

  # Temporal durable-orchestration workers. Request-path role: activities drive CRUD over
  # REST against core-api rather than cross-writing tables, so they need nothing more.
  workflow:
    <<: *backend-app
    command: ["python", "-m", "services.workflow_service.worker"]
    depends_on:
      temporal:
        condition: service_started
      web:
        condition: service_started

  # --- The rest of the service tier ------------------------------------------------------
  #
  # Until now exactly ONE of the nine HTTP services ran in production (core-api, as `web`),
  # so the deployed API was 8 routes and everything else existed only as an importable module.
  # That included api-gateway itself - the component 11-security-architecture.md relies on to
  # fail closed before a tenant-scoped store is touched - and meeting-service, which owns the
  # only route that mints a LiveKit room token.
  #
  # Each service key is the CANONICAL service name from `_canon/01-service-catalog.md`, because
  # the gateway resolves upstreams by that name over docker DNS (`http://<service>:8000`).
  # Renaming one here silently unroutes it; the gateway's route-map test is what catches that.
  #
  # None publish a port. The gateway is the single ingress, and it is reached over the docker
  # network by the Caddy that holds 443.

  # The single public ingress: JWT pre-validation, tenant resolution, signed internal headers,
  # then forwarding. Uses the app DB role because resolving the tenant reads `organizations`.
  api-gateway:
    <<: *backend-app
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  bff:
    <<: *backend-app
    command: ["uvicorn", "services.bff.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  identity-tenant-service:
    <<: *backend-app
    command:
      - uvicorn
      - services.identity_tenant_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Owns the LiveKit transport: room token mint and the LiveKit webhook. Reads
  # LIVEKIT_URL/LIVEKIT_API_KEY/LIVEKIT_API_SECRET from prod.env; without them
  # `select_transport()` falls back to FakeTransport and mints obviously-fake tokens.
  meeting-service:
    <<: *backend-app
    command: ["uvicorn", "services.meeting_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Identical to `web`'s probe. Until this existed, meeting-service was the only route the
    # gateway proxies (`/api/meetings`, `/livekit/webhook`) whose liveness NOTHING checked:
    # `deploy.sh` waited on `mytheus-web-1` alone and mytheus-backend's CI verifies only
    # `api.mytheus.cloud/healthz`, which the gateway answers. A merge that broke this service
    # therefore built green, deployed green and went silently dark - and an unauthenticated
    # probe cannot substitute, because the gateway raises 401 AUTH_REQUIRED before it ever
    # proxies upstream (`services/api_gateway/edge.py`), so a 401 proves only the gateway is up.
    # Declaring it here rather than on the `x-backend-app` anchor keeps this change to the one
    # service it was scoped to; extending it to the other uvicorn apps is a follow-up.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10

  # These four currently expose no routes beyond /healthz - they are scaffolds whose bands have
  # not landed. Deployed anyway so the topology is complete and the gateway's route map has a
  # real upstream to reach: a request to /billing gets a 404 FROM billing-metering-service,
  # which is the truth, rather than a 404 from the gateway that looks identical to a routing bug.
  integration-service:
    <<: *backend-app
    command: ["uvicorn", "services.integration_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  billing-metering-service:
    <<: *backend-app
    command:
      - uvicorn
      - services.billing_metering_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-ops-service:
    <<: *backend-app
    command: ["uvicorn", "services.admin_ops_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  notification-service:
    <<: *backend-app
    command: ["uvicorn", "services.notification_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The web application: marketing, the authenticated app shell, and the meeting room. One
  # Next.js app with route groups, per doc 20 section 2.2 - the marketing site is NOT a
  # separate deployable.
  #
  # Deliberately NOT on the *backend anchors. It holds no database credential and never talks
  # to Postgres: every read goes through the gateway over HTTP, which is what keeps org_id
  # derivation at the edge rather than in the browser tier. Giving it prod.env would hand a
  # public-facing Node process the database URLs, Stripe and LiveKit secrets.
  ui:
    image: ${UI_IMAGE:-ghcr.io/mytheus-ai/mytheus-ui:main}
    pull_policy: always
    # Explicit, namespaced alias. Compose derives an alias from the service key, so this was
    # reachable as plain `ui` - and so is atithivishram-prod's own `ui` container. The Caddy
    # that fronts 443 is attached to BOTH stacks' networks, so `ui` was ambiguous there and
    # resolved to Atithi's container: mytheus.cloud served their product, not ours. Caught by
    # checking the served page title rather than trusting a 200.
    #
    # `redis` and `postgres` are ambiguous across the two stacks for the same reason. They are
    # harmless because only Caddy spans networks and it never proxies to them; every other
    # container resolves names inside its own network. Anything Caddy must reach needs a name
    # that is unique across all three.
    networks:
      default:
        aliases: ["mytheus-webapp"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.ui.env
        required: false
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      # Hits 127.0.0.1, not localhost: the Next standalone server binds IPv4 only, and on
      # this image `localhost` resolves to ::1 first, so a localhost probe never connects and
      # the container is marked unhealthy while serving perfectly.
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "3000"
    restart: unless-stopped

  # No TLS terminator here on purpose. This box already runs one Caddy (the
  # atithivishram-prod stack) holding 80/443, and it is the only listener the host's
  # cf-origin-lock admits Cloudflare traffic to. That Caddy terminates api.mytheus.cloud and
  # vps.mytheus.cloud and reverse-proxies to `web:8000` over the shared docker network.
  #
  # A `caddy` service used to be declared here publishing 80 and 443. It has never actually
  # run, because those ports were already bound; leaving it declared meant any tool that
  # brought the full stack up (Dokploy included) would fail on a port collision. Removed
  # rather than left dormant so the file describes what really runs.

volumes:
  pgdata:
  redisdata:
  redpandadata:
