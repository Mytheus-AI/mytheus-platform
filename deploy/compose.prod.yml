# Self-hosted VPS deploy of the mytheus-backend modular monolith + its data stores.
#
# Resolved infra decision (§8): self-host on the existing VPS rather than Railway/Render. The
# service seams stay real (16-deployment §3.1); this just co-locates them in one deployable on one
# box (srv1804132, 187.127.190.246). One backend image runs three roles (web / relay / workflow);
# Postgres, Redis, and Redpanda (+ Schema Registry) are self-hosted here. Per-store split is
# confirmed at deploy time: point DATABASE_URL at the local `postgres` service OR a managed
# Supabase Postgres by editing env/prod.env — nothing else changes.
#
# SECRETS ARE NOT IN THIS REPO. The env/*.env files and postgres-init/prod-bootstrap.sql are
# gitignored, so they exist only on the deployment host. Every path to them is therefore a
# variable with a working default:
#
#   MYTHEUS_ENV_DIR   directory holding prod.env + the three per-role prod.db.*.env files
#   MYTHEUS_PG_INIT   path to the postgres post-init hook
#
# Defaults are the relative paths that work when deploying from a full working copy
# (./deploy.sh). A deploy tool clones only what git tracks, so it must point these at the
# host directory that holds the real files. Keeping the secrets on the host rather than in
# the deploy tool's database also means re-cloning never destroys them and no credential is
# duplicated into another system's storage.
#
# Bring up:  POSTGRES_PASSWORD=... docker compose -f compose.prod.yml up -d
# Validate:  docker compose -f compose.prod.yml config

name: mytheus

# Shared, NON-DATABASE config only. Defect D1 had two halves: the application connected as a
# role that bypasses RLS, and this one anchor handed the same env_file to migrate, web, relay
# and workflow, so splitting the roles would have achieved nothing while every process could
# still read every credential. The database URL now comes from a per-role file layered on top
# of this one, so the web process has no way to obtain the migrate or operator credential.
x-backend: &backend
  # Pulled, never built here. The `build: context: ../../mytheus-backend` this replaces
  # required a second repo checked out as a sibling of this one, which is why the stack could
  # only ever be deployed by hand on a box where someone had arranged that layout: any deploy
  # tool clones ONE repo and the relative path resolves to nothing. It also meant the running
  # image existed nowhere but the machine that built it, so a rebuild was not reproducible and
  # a rollback had nothing to roll back to.
  #
  # mytheus-backend's CI now publishes this image (ci.yml, `docker` job). `main` follows the
  # branch; pin BACKEND_IMAGE to a `:<sha>` tag to hold a specific build or roll back.
  image: ${BACKEND_IMAGE:-ghcr.io/mytheus-ai/mytheus-backend:main}
  pull_policy: always
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-../env}/prod.env
      required: false
  restart: unless-stopped

# The request path: `mytheus_app`, subject to every tenant_isolation policy.
x-backend-app: &backend-app
  <<: *backend
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-../env}/prod.env
      required: false
    - path: ${MYTHEUS_ENV_DIR:-../env}/prod.db.app.env
      required: false

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env/prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-mytheus}
    volumes:
      # Path is a variable for the same reason MYTHEUS_ENV_DIR is: this file holds the postgres
      # password, so it is gitignored and absent from any fresh clone. Left as a bare relative
      # path, a deploy-tool checkout resolves it to nothing and Docker silently creates an empty
      # DIRECTORY at the mount point. That is invisible today because the hook only runs against
      # an uninitialised data directory and pgdata already exists, but it would break the first
      # boot on a new volume, which is the one moment it has to work.
      - ${MYTHEUS_PG_INIT:-./postgres-init/prod-bootstrap.sql}:/etc/postgresql.schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env/prod.env}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: apply migrations, then give the three roles their passwords. The migration
  # creates them without one on purpose, so bootstrap_roles must run before `web` starts or
  # nothing can authenticate. This is the ONLY process holding the schema-owner credential
  # and the only one holding the role passwords.
  migrate:
    <<: *backend
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-../env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-../env}/prod.db.migrate.env
        required: false
    command:
      - sh
      - -c
      - "alembic -c migrations/alembic.ini upgrade head && python -m scripts.bootstrap_roles"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *backend-app
    command: ["uvicorn", "services.core_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  # The ONLY sanctioned producer: drains the transactional outbox to Redpanda. Runs as
  # `mytheus_relay`, whose single permissive `outbox_relay_drain` policy on `outbox` is what
  # lets it read across tenants without BYPASSRLS. Running it as `mytheus_app` would drain
  # nothing at all and report an empty queue forever (defect D4).
  relay:
    <<: *backend
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-../env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-../env}/prod.db.relay.env
        required: false
    command: ["python", "-m", "services.relay.main"]
    depends_on:
      web:
        condition: service_started
      redpanda:
        condition: service_healthy

  # Temporal durable-orchestration workers. Request-path role: activities drive CRUD over
  # REST against core-api rather than cross-writing tables, so they need nothing more.
  workflow:
    <<: *backend-app
    command: ["python", "-m", "services.workflow_service.worker"]
    depends_on:
      temporal:
        condition: service_started
      web:
        condition: service_started

  # No TLS terminator here on purpose. This box already runs one Caddy (the
  # atithivishram-prod stack) holding 80/443, and it is the only listener the host's
  # cf-origin-lock admits Cloudflare traffic to. That Caddy terminates api.mytheus.cloud and
  # vps.mytheus.cloud and reverse-proxies to `web:8000` over the shared docker network.
  #
  # A `caddy` service used to be declared here publishing 80 and 443. It has never actually
  # run, because those ports were already bound; leaving it declared meant any tool that
  # brought the full stack up (Dokploy included) would fail on a port collision. Removed
  # rather than left dormant so the file describes what really runs.

volumes:
  pgdata:
  redisdata:
  redpandadata:
