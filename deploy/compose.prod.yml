# Self-hosted VPS deploy of the mytheus-backend modular monolith + its data stores.
#
# Resolved infra decision (§8): self-host on the existing VPS rather than Railway/Render. The
# service seams stay real (16-deployment §3.1); this just co-locates them in one deployable on one
# box (srv1804132, 187.127.190.246). One backend image runs three roles (web / relay / workflow);
# Postgres, Redis, and Redpanda (+ Schema Registry) are self-hosted here. Per-store split is
# confirmed at deploy time: point DATABASE_URL at the local `postgres` service OR a managed
# Supabase Postgres by editing env/prod.env — nothing else changes.
#
# SECRETS ARE NOT IN THIS REPO. The env/*.env files and postgres-init/prod-bootstrap.sql are
# gitignored, so they exist only on the deployment host. Every path to them is therefore a
# variable with a working default:
#
#   MYTHEUS_ENV_DIR   directory holding prod.env + the three per-role prod.db.*.env files
#   MYTHEUS_PG_INIT   path to the postgres post-init hook
#
# The defaults are absolute, and specifically under /etc/dokploy/mytheus-secrets, for a
# reason that is not obvious and cost a long debugging session.
#
# Dokploy runs `docker compose` INSIDE the dokploy container, with the docker socket bind
# mounted. The compose CLI therefore resolves every env_file path against the CONTAINER's
# filesystem, while the resulting containers are created on the host daemon. /srv is not
# mounted into that container, so an env_file under /srv resolves to nothing there - and
# because these entries are `required: false` (so a checkout without secrets still renders)
# nothing errors. compose emits services with an empty environment and the backend starts
# with no DATABASE_URL, surfacing only as `migrate` dying on KeyError: 'DATABASE_URL'.
#
# Running the identical command by hand on the host succeeds, which is what makes this so
# misleading: the host's compose sees /srv, the container's does not. The give-away is that
# the two report different compose versions.
#
# /etc/dokploy is bind mounted into the dokploy container at the SAME path, so paths under it
# resolve identically in both namespaces. That matters twice over: env_file is read by the
# compose CLI (container side), while the MYTHEUS_PG_INIT bind mount below is handed to the
# docker daemon as a host path (host side). Only a path valid in both can satisfy both.
#
# Secrets stay on the host and are never copied into Dokploy's database, so re-cloning cannot
# destroy them and no credential is duplicated into another system's storage. Override both
# variables to deploy anywhere else.
#
# Bring up:  POSTGRES_PASSWORD=... docker compose -f compose.prod.yml up -d
# Validate:  docker compose -f compose.prod.yml config

name: mytheus

# Shared, NON-DATABASE config only. Defect D1 had two halves: the application connected as a
# role that bypasses RLS, and this one anchor handed the same env_file to migrate, web, relay
# and workflow, so splitting the roles would have achieved nothing while every process could
# still read every credential. The database URL now comes from a per-role file layered on top
# of this one, so the web process has no way to obtain the migrate or operator credential.
x-backend: &backend
  # Pulled, never built here. The `build: context: ../../mytheus-backend` this replaces
  # required a second repo checked out as a sibling of this one, which is why the stack could
  # only ever be deployed by hand on a box where someone had arranged that layout: any deploy
  # tool clones ONE repo and the relative path resolves to nothing. It also meant the running
  # image existed nowhere but the machine that built it, so a rebuild was not reproducible and
  # a rollback had nothing to roll back to.
  #
  # mytheus-backend's CI now publishes this image (ci.yml, `docker` job). `main` follows the
  # branch; pin BACKEND_IMAGE to a `:<sha>` tag to hold a specific build or roll back.
  image: ${BACKEND_IMAGE:-ghcr.io/mytheus-ai/mytheus-backend:main}
  pull_policy: always
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
      required: false
  restart: unless-stopped

# The request path: `mytheus_app`, subject to every tenant_isolation policy.
x-backend-app: &backend-app
  <<: *backend
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
      required: false
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.app.env
      required: false

# --- Intelligence + realtime tiers (opt-in via compose profiles) ----------------------------
#
# These tiers are behind PROFILES (`intelligence`, `realtime`, `observability`; ner and kg have
# their own) and are therefore NOT started by a plain `docker compose up -d`, which is what
# the forced-command deploy runs. That is deliberate: until their images are published, a
# default-on definition would make `up -d --pull always` fail on the first missing image and
# break the deploy of the services that DO exist. To enable, set on the host (e.g. in the
# deploy environment): COMPOSE_PROFILES=intelligence,realtime,observability
#
# Credential isolation follows the D1 pattern: no new service reads prod.env (Clerk, Stripe,
# LiveKit secrets). Each gets the shared NON-SECRET topology file prod.platform.env plus only
# the secret file(s) it needs:
#   prod.qdrant.env          qdrant            both Qdrant keys (server side)
#   prod.db.ai.env           embedding*, ingestion*, search*   DATABASE_URL as mytheus_ai_app
#   prod.db.ai-relay.env     embedding-relay   DATABASE_URL as mytheus_ai_relay
#   prod.embedding.env       embedding*        QDRANT_API_KEY (WRITE) - nobody else holds it
#   prod.search.env          search*, kg       QDRANT_READ_ONLY_API_KEY
#   prod.ingestion.env       ingestion*        S3_* object-storage credential (Cloudflare R2)
#   prod.realtime.env        realtime-gateway  Clerk JWKS URL etc. (no DB credential at all)
#   prod.transcription.env   transcription     Deepgram + LiveKit + its DB credential
#   prod.grafana.env         grafana           admin password
x-intel: &intel
  image: ${INTELLIGENCE_IMAGE:-ghcr.io/mytheus-ai/mytheus-intelligence:main}
  pull_policy: always
  restart: unless-stopped
  profiles: ["intelligence"]
  env_file:
    - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
      required: false

x-healthz-py: &healthz-py
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    # POSTGRES_PASSWORD arrives via env_file, NOT `${POSTGRES_PASSWORD}` interpolation.
    # Interpolation cannot read an env_file: it resolves from the shell or the project .env
    # before compose parses anything. So an interpolated superuser password has to be handed
    # to whatever runs the deploy, and Dokploy stores env in its database and serves it back
    # in plaintext to any holder of an API key. Reading it from the host file instead keeps
    # the strongest credential in the stack out of that blast radius.
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
    volumes:
      # Path is a variable for the same reason MYTHEUS_ENV_DIR is: this file holds the postgres
      # password, so it is gitignored and absent from any fresh clone. Left as a bare relative
      # path, a deploy-tool checkout resolves it to nothing and Docker silently creates an empty
      # DIRECTORY at the mount point. That is invisible today because the hook only runs against
      # an uninitialised data directory and pgdata already exists, but it would break the first
      # boot on a new volume, which is the one moment it has to work.
      - ${MYTHEUS_PG_INIT:-/etc/dokploy/mytheus-secrets/prod-bootstrap.sql}:/etc/postgresql.schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
    volumes:
      - redpandadata:/var/lib/redpanda/data
    # Redpanda budgets topic_fds_per_partition (5) open files per partition and refuses to create
    # partitions past nofile / 5. Docker's default nofile of 1024 capped it at 204 partitions,
    # far below the 738 the canonical topic set needs, so create_topics.sh failed at the first
    # 24-partition topic after transcript-chunks (180).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    # Its own one-line env file rather than prod.env, for the same reason the backend roles
    # each get their own: temporal needs exactly one secret (the postgres password, under the
    # name POSTGRES_PWD that this image expects) and handing it prod.env would also hand it
    # every Clerk, Stripe and LiveKit credential it has no business holding.
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.temporal.env
        required: false
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: apply migrations, then give the three roles their passwords. The migration
  # creates them without one on purpose, so bootstrap_roles must run before `web` starts or
  # nothing can authenticate. This is the ONLY process holding the schema-owner credential
  # and the only one holding the role passwords.
  migrate:
    <<: *backend
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.migrate.env
        required: false
    command:
      - sh
      - -c
      - "alembic -c migrations/alembic.ini upgrade head && python -m scripts.bootstrap_roles"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *backend-app
    # Aliased to `core-api` because that is the canonical service name the gateway's ROUTE_MAP
    # resolves (`http://core-api:8000`). Kept as the service key `web` rather than renamed so
    # the container is not recreated and Caddy's existing `web:8000` upstream keeps working
    # during the cutover; both names resolve on the network.
    networks:
      default:
        aliases: ["core-api"]
    command: ["uvicorn", "services.core_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  # The ONLY sanctioned producer: drains the transactional outbox to Redpanda. Runs as
  # `mytheus_relay`, whose single permissive `outbox_relay_drain` policy on `outbox` is what
  # lets it read across tenants without BYPASSRLS. Running it as `mytheus_app` would drain
  # nothing at all and report an empty queue forever (defect D4).
  relay:
    <<: *backend
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.relay.env
        required: false
    command: ["python", "-m", "services.relay.main"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      web:
        condition: service_started
      redpanda:
        condition: service_healthy

  # Temporal durable-orchestration workers. Request-path role: activities drive CRUD over
  # REST against core-api rather than cross-writing tables, so they need nothing more.
  workflow:
    <<: *backend-app
    command: ["python", "-m", "services.workflow_service.worker"]
    depends_on:
      temporal:
        condition: service_started
      web:
        condition: service_started

  # --- The rest of the service tier ------------------------------------------------------
  #
  # Until now exactly ONE of the nine HTTP services ran in production (core-api, as `web`),
  # so the deployed API was 8 routes and everything else existed only as an importable module.
  # That included api-gateway itself - the component 11-security-architecture.md relies on to
  # fail closed before a tenant-scoped store is touched - and meeting-service, which owns the
  # only route that mints a LiveKit room token.
  #
  # Each service key is the CANONICAL service name from `_canon/01-service-catalog.md`, because
  # the gateway resolves upstreams by that name over docker DNS (`http://<service>:8000`).
  # Renaming one here silently unroutes it; the gateway's route-map test is what catches that.
  #
  # None publish a port. The gateway is the single ingress, and it is reached over the docker
  # network by the Caddy that holds 443.

  # The single public ingress: JWT pre-validation, tenant resolution, signed internal headers,
  # then forwarding. Uses the app DB role because resolving the tenant reads `organizations`.
  api-gateway:
    <<: *backend-app
    command: ["uvicorn", "services.api_gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  bff:
    <<: *backend-app
    command: ["uvicorn", "services.bff.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  identity-tenant-service:
    <<: *backend-app
    command:
      - uvicorn
      - services.identity_tenant_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    # Key custody (mytheus-docs ADR-0026): the KEK and the blind-index root are files, mounted
    # read-only into THIS container ONLY. No other service gets them. Host files must be mode
    # 0400 owned by uid 10001 (the image's appuser); the provider refuses to start otherwise,
    # and mytheus-deploy.sh checks the same before `up`. create_host_path: false so a missing
    # host file is an error, not a silently created empty directory. Only paths and the
    # custody mode are set here; no key value is ever in an environment variable.
    environment:
      MYTHEUS_KEY_CUSTODY: local-file
      MYTHEUS_KEK_FILE: /run/secrets/mytheus_kek
      MYTHEUS_BLIND_INDEX_KEY_FILE: /run/secrets/mytheus_blind_index_key
    volumes:
      - type: bind
        source: ${MYTHEUS_KEYS_DIR:-/etc/dokploy/mytheus-secrets/keys}/mytheus_kek
        target: /run/secrets/mytheus_kek
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MYTHEUS_KEYS_DIR:-/etc/dokploy/mytheus-secrets/keys}/mytheus_blind_index_key
        target: /run/secrets/mytheus_blind_index_key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Owns the LiveKit transport: room token mint and the LiveKit webhook. Reads
  # LIVEKIT_URL/LIVEKIT_API_KEY/LIVEKIT_API_SECRET from prod.env; without them
  # `select_transport()` falls back to FakeTransport and mints obviously-fake tokens.
  meeting-service:
    <<: *backend-app
    command: ["uvicorn", "services.meeting_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # The API process must not tap audio; the dedicated `audio-tap-worker` does.
      AUDIO_TAP_MODE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Identical to `web`'s probe. Until this existed, meeting-service was the only route the
    # gateway proxies (`/api/meetings`, `/livekit/webhook`) whose liveness NOTHING checked:
    # `deploy.sh` waited on `mytheus-web-1` alone and mytheus-backend's CI verifies only
    # `api.mytheus.cloud/healthz`, which the gateway answers. A merge that broke this service
    # therefore built green, deployed green and went silently dark - and an unauthenticated
    # probe cannot substitute, because the gateway raises 401 AUTH_REQUIRED before it ever
    # proxies upstream (`services/api_gateway/edge.py`), so a 401 proves only the gateway is up.
    # Declaring it here rather than on the `x-backend-app` anchor keeps this change to the one
    # service it was scoped to; extending it to the other uvicorn apps is a follow-up.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Kafka consumers + audio tap (default profile, same as web/meeting-service) -----------
  #
  # Each has its OWN DB credential file (D1 pattern) so no consumer can read another's, or the
  # request-path `prod.db.app.env`. Kafka/Redpanda topology comes from prod.env like `relay`.
  # METRICS_PORT=9100 is scraped by the `workers` job; there is no HTTP port, so no healthcheck.
  core-api-consumer:
    <<: *backend
    # Opt-in (`--profile workers`): Needs the prod.db.core-consumer.env database role. Without them it would crash-loop on a plain `up`.
    profiles: [workers]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.core-consumer.env
        required: false
    command: ["python", "-m", "services.core_api.consumer"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      web:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # --- Plan 7: metering and the personal-listener agent (mytheus-docs ADR-0029, ADR-0030) ----
  #
  # billing-consumer meters `usage-events` into usage_events / agent_budgets and the Redis
  # budget mirror. billing-temporal-worker runs the nightly rollup activity that the
  # `usage-rollup-nightly` schedule (registered by `workflow`) dispatches to billing's task
  # queue. Both are request-path roles (mytheus_app, RLS per tenant), like billing itself.
  billing-consumer:
    <<: *backend-app
    profiles: [workers]
    command: ["python", "-m", "services.billing_metering_service.consumer"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      billing-metering-service:
        condition: service_started
      redpanda:
        condition: service_healthy

  billing-temporal-worker:
    <<: *backend-app
    profiles: [workers]
    command: ["python", "-m", "services.billing_metering_service.temporal_worker"]
    depends_on:
      temporal:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Profile `agents`. get_user_context over gRPC (identity.proto), mesh-internal only: no Caddy
  # route, no published port. The agent runtime is its only caller.
  identity-grpc:
    <<: *backend-app
    profiles: [agents]
    command: ["python", "-m", "services.identity_tenant_service.grpc_server"]
    expose:
      - "50051"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Profile `agents`. Consumes transcript-chunks + meeting-room-events, runs PersonalListenerAgent,
  # produces agent-results / agent-stream / usage-events / notifications. Writes NO Postgres, so it
  # gets no database credential. prod.agents.env holds its secrets only:
  #   ANTHROPIC_API_KEY, ANTHROPIC_WORKSPACE_ID (when the key is not workspace-scoped),
  #   BILLING_SERVICE_TOKEN (= the agent-runtime-service entry of MYTHEUS_BILLING_CALLER_TOKENS,
  #   which billing-metering-service reads from prod.env).
  # Every model call is gated on the tenant budget; with billing unreachable it calls nothing.
  agent-runtime:
    <<: *intel
    profiles: [agents]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.agents.env
        required: false
    command: ["python", "-m", "services.agent_runtime_service.consumer"]
    environment:
      BILLING_URL: http://billing-metering-service:8000
      IDENTITY_GRPC_ADDR: identity-grpc:50051
      METRICS_PORT: "9100"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      billing-metering-service:
        condition: service_started
      identity-grpc:
        condition: service_started

  meeting-consumer:
    <<: *backend
    # Opt-in (`--profile workers`): Needs the prod.db.meeting-consumer.env database role. Without them it would crash-loop on a plain `up`.
    profiles: [workers]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.meeting-consumer.env
        required: false
    command: ["python", "-m", "services.meeting_service.consumer"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      meeting-service:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # Dedicated LiveKit audio tap -> transcription-service. No DB credential at all: prod.env
  # (LIVEKIT_URL/API_KEY/API_SECRET, same source as meeting-service) + prod.audio-tap.env
  # (INTERNAL_AUDIO_TOKEN, which must equal the value transcription-service validates).
  # Publishes no ports. transcription-service is in the `realtime` profile, so without that
  # profile this worker retries its connection; enable `realtime` together with this.
  audio-tap-worker:
    <<: *backend
    # Opt-in (`--profile workers`): Needs LiveKit credentials, INTERNAL_AUDIO_TOKEN and the realtime tier. Without them it would crash-loop on a plain `up`.
    profiles: [workers]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.audio-tap.env
        required: false
    command: ["python", "-m", "services.meeting_service.audio_tap_worker"]
    environment:
      AUDIO_TAP_MODE: worker
      TRANSCRIPTION_AUDIO_URL: ws://transcription-service:8091/internal/audio
      METRICS_PORT: "9100"
    depends_on:
      meeting-service:
        condition: service_healthy

  # These four currently expose no routes beyond /healthz - they are scaffolds whose bands have
  # not landed. Deployed anyway so the topology is complete and the gateway's route map has a
  # real upstream to reach: a request to /billing gets a 404 FROM billing-metering-service,
  # which is the truth, rather than a 404 from the gateway that looks identical to a routing bug.
  integration-service:
    <<: *backend-app
    command: ["uvicorn", "services.integration_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  billing-metering-service:
    <<: *backend-app
    command:
      - uvicorn
      - services.billing_metering_service.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-ops-service:
    <<: *backend-app
    command: ["uvicorn", "services.admin_ops_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  notification-service:
    <<: *backend-app
    command: ["uvicorn", "services.notification_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The web application: marketing, the authenticated app shell, and the meeting room. One
  # Next.js app with route groups, per doc 20 section 2.2 - the marketing site is NOT a
  # separate deployable.
  #
  # Deliberately NOT on the *backend anchors. It holds no database credential and never talks
  # to Postgres: every read goes through the gateway over HTTP, which is what keeps org_id
  # derivation at the edge rather than in the browser tier. Giving it prod.env would hand a
  # public-facing Node process the database URLs, Stripe and LiveKit secrets.
  ui:
    image: ${UI_IMAGE:-ghcr.io/mytheus-ai/mytheus-ui:main}
    pull_policy: always
    # Explicit, namespaced alias. Compose derives an alias from the service key, so this was
    # reachable as plain `ui` - and so is atithivishram-prod's own `ui` container. The Caddy
    # that fronts 443 is attached to BOTH stacks' networks, so `ui` was ambiguous there and
    # resolved to Atithi's container: mytheus.cloud served their product, not ours. Caught by
    # checking the served page title rather than trusting a 200.
    #
    # `redis` and `postgres` are ambiguous across the two stacks for the same reason. They are
    # harmless because only Caddy spans networks and it never proxies to them; every other
    # container resolves names inside its own network. Anything Caddy must reach needs a name
    # that is unique across all three.
    networks:
      default:
        aliases: ["mytheus-webapp"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.ui.env
        required: false
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      # Hits 127.0.0.1, not localhost: the Next standalone server binds IPv4 only, and on
      # this image `localhost` resolves to ::1 first, so a localhost probe never connects and
      # the container is marked unhealthy while serving perfectly.
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    expose:
      - "3000"
    restart: unless-stopped

  # No TLS terminator here on purpose. This box already runs one Caddy (the
  # atithivishram-prod stack) holding 80/443, and it is the only listener the host's
  # cf-origin-lock admits Cloudflare traffic to. That Caddy terminates api.mytheus.cloud and
  # vps.mytheus.cloud and reverse-proxies to `web:8000` over the shared docker network.
  #
  # A `caddy` service used to be declared here publishing 80 and 443. It has never actually
  # run, because those ports were already bound; leaving it declared meant any tool that
  # brought the full stack up (Dokploy included) would fail on a port collision. Removed
  # rather than left dormant so the file describes what really runs.

  # --- Intelligence tier (profile: intelligence) ----------------------------------------------
  #
  # Container-internal ports (embedding 8101, reranker 8102, ingestion 8103, search 8104 ... kg 8106).
  # They are independent of the local dev ports in mytheus-intelligence/README.md (8200 block).
  # None publish a port; reachable only on the docker network.

  # Vector store. The two-key split mirrors mytheus-intelligence/docker-compose.yml and
  # libs/shared/qdrant.py: the WRITE key (QDRANT__SERVICE__API_KEY) goes to embedding-service
  # only, via prod.embedding.env as QDRANT_API_KEY; every reader gets the READ-ONLY key. The two
  # must differ (libs/shared/qdrant.py refuses to build a client otherwise). No ports published:
  # unlike dev, nothing outside the docker network can reach it.
  # If prod.qdrant.env is MISSING this starts with NO api key (required: false keeps a
  # secretless checkout renderable); mytheus-deploy.sh asserts both keys before `up`.
  qdrant:
    image: qdrant/qdrant:v1.12.4
    profiles: ["intelligence"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.qdrant.env
        required: false
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Plain TCP probe: /collections needs a key once one is configured (see the dev file).
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Synchronous query-embed API (POST /internal/embed). CPU by default; compose.gpu.yml swaps
  # the image and requests the GPU. Holds the Qdrant WRITE key (sole writer, CLAUDE.md).
  embedding-service:
    <<: *intel
    networks:
      default:
        aliases: ["mytheus-embedding"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.embedding.env
        required: false
    command: ["uvicorn", "services.embedding_service.main:app", "--host", "0.0.0.0", "--port", "8101"]
    environment:
      EMBEDDING_GPU: "0"
    depends_on:
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8101/healthz').status==200 else 1)"
    expose:
      - "8101"

  # The embed-on-ingest consumer: the process that actually writes Qdrant.
  embedding-worker:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.embedding.env
        required: false
    command: ["python", "-m", "services.embedding_service.worker"]
    environment:
      EMBEDDING_GPU: "0"
      METRICS_PORT: "9100"
    depends_on:
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Drains intelligence.outbox. One relay per repo (intelligence CLAUDE.md); its own role
  # (mytheus_ai_relay) and its own file so no request-path process can read that credential.
  embedding-relay:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai-relay.env
        required: false
    command: ["python", "-m", "services.embedding_service.relay_main"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy

  reranker-service:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
    command: ["uvicorn", "services.reranker_service.main:app", "--host", "0.0.0.0", "--port", "8102"]
    environment:
      RERANKER_GPU: "0"
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8102/healthz').status==200 else 1)"
    expose:
      - "8102"

  ingestion-service:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.ingestion.env
        required: false
    command: ["uvicorn", "services.ingestion_service.main:app", "--host", "0.0.0.0", "--port", "8103"]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8103/healthz').status==200 else 1)"
    expose:
      - "8103"

  ingestion-worker:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.ingestion.env
        required: false
    command: ["python", "-m", "services.ingestion_service.worker"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Holds the Qdrant READ-ONLY key only.
  search-service:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.search.env
        required: false
    command: ["uvicorn", "services.search_service.main:app", "--host", "0.0.0.0", "--port", "8104"]
    depends_on:
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8104/healthz').status==200 else 1)"
    expose:
      - "8104"

  search-worker:
    <<: *intel
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.search.env
        required: false
    command: ["python", "-m", "services.search_service.worker"]
    environment:
      METRICS_PORT: "9100"
    depends_on:
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Disabled by default (profile `ner` only; NOT enabled by `intelligence`). Own image and
  # Dockerfile (services/ner_service/Dockerfile: spaCy, no DB, no Qdrant). Container port is
  # moved from the Dockerfile's 8080 to 8105, so its baked-in HEALTHCHECK is overridden.
  ner-service:
    image: ${NER_IMAGE:-ghcr.io/mytheus-ai/mytheus-ner:main}
    pull_policy: always
    profiles: ["ner"]
    restart: unless-stopped
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
    command: ["uvicorn", "services.ner_service.main:app", "--host", "0.0.0.0", "--port", "8105"]
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8105/healthz').status==200 else 1)"
    expose:
      - "8105"

  # Disabled by default (profile `kg`): scaffold that answers only /healthz today. Needs
  # Postgres+AGE; reads (never writes) Qdrant.
  knowledge-graph-service:
    <<: *intel
    profiles: ["kg"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.ai.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.search.env
        required: false
    command: ["uvicorn", "services.knowledge_graph_service.main:app", "--host", "0.0.0.0", "--port", "8106"]
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8106/healthz').status==200 else 1)"
    expose:
      - "8106"

  # --- Realtime tier (profile: realtime) ----------------------------------------------------

  # Socket.io fan-out. Public via Caddy (/socket.io/* on the api host). Holds NO database
  # credential: Redis + Redpanda + Clerk JWKS only. The alias is namespaced because the shared
  # Caddy spans other stacks' networks (see the `ui` comment).
  realtime-gateway:
    image: ${REALTIME_GATEWAY_IMAGE:-ghcr.io/mytheus-ai/mytheus-realtime-gateway:main}
    pull_policy: always
    profiles: ["realtime"]
    restart: unless-stopped
    networks:
      default:
        aliases: ["mytheus-realtime"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.realtime.env
        required: false
    environment:
      PORT: "8090"
      WS_BIND_HOST: "0.0.0.0"
      CORE_API_URL: http://core-api:8000
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      # Node 20 global fetch; 127.0.0.1 not localhost (IPv4-only bind, same trap as `ui`).
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    expose:
      - "8090"

  # Deepgram WS proxy. Internal only (LiveKit's audio hook connects over the docker network).
  # Holds its own DB credential (transcript_chunks) + Deepgram + LiveKit; nothing else does.
  # /healthz does NOT reflect consumer liveness (known gap 8b).
  transcription-service:
    image: ${TRANSCRIPTION_IMAGE:-ghcr.io/mytheus-ai/mytheus-transcription:main}
    pull_policy: always
    profiles: ["realtime"]
    restart: unless-stopped
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.platform.env
        required: false
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.transcription.env
        required: false
    command: ["uvicorn", "transcription_service.main:app", "--host", "0.0.0.0", "--port", "8091"]
    environment:
      TRANSCRIPTION_WS_BIND: "0.0.0.0"
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *healthz-py
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/healthz').status==200 else 1)"
    expose:
      - "8091"

  # One-shot schema migrations for the optional tiers. Each tier owns its own Alembic history
  # (its own version table), and production had never run either, so transcript_chunks and the
  # intelligence schema did not exist there. They run as the schema owner from
  # prod.db.migrate.env, on every `up` with their profile, and exit; a no-op when at head.
  migrate-transcription:
    image: ${TRANSCRIPTION_IMAGE:-ghcr.io/mytheus-ai/mytheus-transcription:main}
    pull_policy: always
    profiles: ["realtime"]
    restart: "no"
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.migrate.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate-intelligence:
    image: ${INTELLIGENCE_IMAGE:-ghcr.io/mytheus-ai/mytheus-intelligence:main}
    pull_policy: always
    profiles: ["intelligence"]
    restart: "no"
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.db.migrate.env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # --- Observability (profile: observability) -----------------------------------------------
  #
  # INTERNAL ONLY: no published ports and no Caddy route (a commented, basic-auth-gated Grafana
  # block exists in caddy/mytheus.caddy). Reach Grafana with an SSH tunnel to its container IP,
  # or enable that block. Config is read from ../observability in this checkout; override with
  # MYTHEUS_OBS_DIR if the deploy tool does not keep the repo layout (Dokploy: see header).
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ${MYTHEUS_OBS_DIR:-../observability}/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - "9090"
    restart: unless-stopped

  # Receives Prometheus alerts. Default receiver is a null sink (no notification credentials in
  # this repo); add a real receiver in alertmanager.yml / a mounted override when decided.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ${MYTHEUS_OBS_DIR:-../observability}/alertmanager:/etc/alertmanager:ro
      - alertmanagerdata:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - "9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    networks:
      default:
        aliases: ["mytheus-grafana"]
    env_file:
      - path: ${MYTHEUS_ENV_DIR:-/etc/dokploy/mytheus-secrets/env}/prod.grafana.env
        required: false
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${MYTHEUS_OBS_DIR:-../observability}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${MYTHEUS_OBS_DIR:-../observability}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - "3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  redpandadata:
  qdrantdata:
  prometheusdata:
  alertmanagerdata:
  grafanadata:
