# Self-hosted VPS deploy of the mytheus-backend modular monolith + its data stores.
#
# Resolved infra decision (§8): self-host on the existing VPS rather than Railway/Render. The
# service seams stay real (16-deployment §3.1); this just co-locates them in one deployable on one
# box (srv1756037.hstgr.cloud, KVM 8). One backend image runs three roles (web / relay / workflow);
# Postgres, Redis, and Redpanda (+ Schema Registry) are self-hosted here. Per-store split is
# confirmed at deploy time: point DATABASE_URL at the local `postgres` service OR a managed
# Supabase Postgres by editing env/prod.env — nothing else changes.
#
# Bring up:  POSTGRES_PASSWORD=... docker compose -f compose.prod.yml up -d --build
# Validate:  docker compose -f compose.prod.yml config

name: mytheus

# Shared, NON-DATABASE config only. Defect D1 had two halves: the application connected as a
# role that bypasses RLS, and this one anchor handed the same env_file to migrate, web, relay
# and workflow, so splitting the roles would have achieved nothing while every process could
# still read every credential. The database URL now comes from a per-role file layered on top
# of this one, so the web process has no way to obtain the migrate or operator credential.
x-backend: &backend
  image: ${BACKEND_IMAGE:-mytheus-backend:plan0}
  build:
    context: ${BACKEND_CONTEXT:-../../mytheus-backend}
  env_file:
    - path: ../env/prod.env
      required: false
  restart: unless-stopped

# The request path: `mytheus_app`, subject to every tenant_isolation policy.
x-backend-app: &backend-app
  <<: *backend
  env_file:
    - path: ../env/prod.env
      required: false
    - path: ../env/prod.db.app.env
      required: false

services:
  postgres:
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env/prod.env}
      POSTGRES_DB: ${POSTGRES_DB:-mytheus}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
      - --schema-registry-addr http://0.0.0.0:8081
      - --pandaproxy-addr http://0.0.0.0:8082
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in env/prod.env}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: apply migrations, then give the three roles their passwords. The migration
  # creates them without one on purpose, so bootstrap_roles must run before `web` starts or
  # nothing can authenticate. This is the ONLY process holding the schema-owner credential
  # and the only one holding the role passwords.
  migrate:
    <<: *backend
    env_file:
      - path: ../env/prod.env
        required: false
      - path: ../env/prod.db.migrate.env
        required: false
    command:
      - sh
      - -c
      - "alembic -c migrations/alembic.ini upgrade head && python -m scripts.bootstrap_roles"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *backend-app
    command: ["uvicorn", "services.core_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "8000"

  # The ONLY sanctioned producer: drains the transactional outbox to Redpanda. Runs as
  # `mytheus_relay`, whose single permissive `outbox_relay_drain` policy on `outbox` is what
  # lets it read across tenants without BYPASSRLS. Running it as `mytheus_app` would drain
  # nothing at all and report an empty queue forever (defect D4).
  relay:
    <<: *backend
    env_file:
      - path: ../env/prod.env
        required: false
      - path: ../env/prod.db.relay.env
        required: false
    command: ["python", "-m", "services.relay.main"]
    depends_on:
      web:
        condition: service_started
      redpanda:
        condition: service_healthy

  # Temporal durable-orchestration workers. Request-path role: activities drive CRUD over
  # REST against core-api rather than cross-writing tables, so they need nothing more.
  workflow:
    <<: *backend-app
    command: ["python", "-m", "services.workflow_service.worker"]
    depends_on:
      temporal:
        condition: service_started
      web:
        condition: service_started

  # TLS termination + reverse proxy (automatic HTTPS via ACME for PUBLIC_HOSTNAME).
  caddy:
    image: caddy:2
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-srv1756037.hstgr.cloud}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  redpandadata:
  caddydata:
  caddyconfig:
