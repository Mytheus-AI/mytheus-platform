# Prometheus scrape config. Internal-only; see deploy/compose.prod.yml (profile: observability).
#
# Metric names are the contract in mytheus-backend/design/metrics.md. That file did not exist
# when this was written, so these names are ASSUMED and must be reconciled with it:
#   http_request_duration_seconds   histogram, label `status` (HTTP code) assumed
#   consumer_lag_seconds            gauge, labels `group`, `topic` assumed
#   messages_processed_total        counter
#   dlq_total                       counter
#   outbox_backlog                  gauge
#   embedding_batch_duration_seconds  histogram  (NOT in the agreed list - invented here)
#
# Targets are the services' HTTP apps. The queue workers (embedding-worker, ingestion-worker,
# search-worker, embedding-relay) serve no HTTP port today, so they are not scraped; lag/DLQ
# metrics must be exposed by a service on the list below or workers need a metrics port.
# A target that serves no /metrics shows up as `up == 0` (alert: TargetDown, warning only).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  # Backend tier (all uvicorn on :8000, docker DNS service names).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - web:8000
          - api-gateway:8000
          - bff:8000
          - identity-tenant-service:8000
          - meeting-service:8000
          - integration-service:8000
          - billing-metering-service:8000
          - admin-ops-service:8000
          - notification-service:8000
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service

  # Intelligence tier (profile: intelligence; ner/kg only if their profiles are on).
  - job_name: intelligence
    metrics_path: /metrics
    static_configs:
      - targets:
          - embedding-service:8101
          - reranker-service:8102
          - ingestion-service:8103
          - search-service:8104
          - ner-service:8105
          - knowledge-graph-service:8106
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service

  # Realtime tier (profile: realtime).
  - job_name: realtime
    metrics_path: /metrics
    static_configs:
      - targets:
          - realtime-gateway:8090
          - transcription-service:8091
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
