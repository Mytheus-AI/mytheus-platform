# Alert rules. Prometheus evaluates these and sends firing alerts to Alertmanager
# (observability/alertmanager/alertmanager.yml). Its default receiver is a null sink, so alerts
# are visible in the Alertmanager/Prometheus UI but notify nobody until a real receiver is added.
# Metric names: mytheus-backend/design/metrics.md (all prefixed `mytheus_`).
groups:
  - name: mytheus-pipeline
    rules:
      - alert: ConsumerLagHigh
        # Lag above 5s SUSTAINED for 5 minutes, per consumer group/topic.
        expr: max by (service, group, topic) (mytheus_consumer_lag_seconds) > 5
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Consumer lag > 5s for 5m ({{ $labels.service }} {{ $labels.group }}/{{ $labels.topic }})"

      - alert: DeadLetterQueueNonEmpty
        # Any dead-lettered message at all in the last 5 minutes. `for: 0m` = fire immediately.
        expr: sum by (service, topic) (increase(mytheus_consumer_dlq_total[5m])) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "Messages dead-lettered ({{ $labels.service }} {{ $labels.topic }})"

      - alert: OutboxBacklogGrowing
        expr: max by (service) (mytheus_outbox_backlog) > 1000
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Outbox backlog > 1000 for 10m ({{ $labels.service }}); is the relay running?"

      - alert: ConsumerStalled
        # consumer_lag_seconds does not grow while a consumer is stalled (metrics.md), so also
        # alert when a consumer that was processing stops processing.
        expr: sum by (service, group, topic) (increase(mytheus_consumer_messages_processed_total[15m])) == 0 and sum by (service, group, topic) (increase(mytheus_consumer_messages_processed_total[1h])) > 0
        for: 5m
        labels: { severity: warn }
        annotations:
          summary: "Consumer stopped processing ({{ $labels.service }} {{ $labels.group }}/{{ $labels.topic }})"

      - alert: TargetDown
        expr: up == 0
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "{{ $labels.job }}/{{ $labels.instance }} is not scrapable (down, or serves no /metrics)"

      - alert: AudioTapWorkerDown
        # absent() also fires when the target was never discovered or is not deployed at all.
        expr: absent(up{job="workers",service="audio-tap-worker"} == 1)
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "No audio-tap-worker scrape target is up for 2m; meeting audio is not reaching transcription"

  # Agent quality (polish plan, "Quality telemetry"). Series from mytheus-intelligence
  # libs/shared/agent_metrics.py, scraped from agent-runtime:9100 (job `workers`); dashboard
  # observability/grafana/dashboards/agents.json. These series carry `org_id` by design.
  - name: mytheus-agents
    rules:
      - alert: AgentTimeToCardSlow
        # Speech to card p50 above the 6 s target ("How we will know") for 15 minutes, per agent.
        expr: histogram_quantile(0.5, sum by (le, agent) (rate(mytheus_agent_time_to_card_seconds_bucket[5m]))) > 6
        for: 15m
        labels: { severity: page }
        annotations:
          summary: "{{ $labels.agent }}: time to card p50 is {{ $value | humanizeDuration }} (> 6s for 15m)"

      - alert: AgentParseFailureRateHigh
        # More than 2% of model answers fail their prompt's format, with at least 50 answers in
        # the 15 minutes so a handful of calls cannot page anyone.
        expr: |
          (
            sum by (agent) (rate(mytheus_agent_parse_failures_total[15m]))
              / sum by (agent) (rate(mytheus_agent_parsed_total[15m]))
          ) > 0.02
          and sum by (agent) (increase(mytheus_agent_parsed_total[15m])) >= 50
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "{{ $labels.agent }}: {{ $value | humanizePercentage }} of model answers fail their format (> 2%)"

      - alert: AgentSpendPerMeetingHourOverBudget
        # List-price model spend per hour of meeting transcript above the 3.5 USD budget, per
        # workspace, over the last hour, once the workspace had at least 10 minutes of meeting.
        expr: |
          (
            3600 * sum by (org_id) (rate(mytheus_agent_spend_usd_total[1h]))
              / sum by (org_id) (rate(mytheus_agent_meeting_seconds_total[1h]))
          ) > 3.5
          and sum by (org_id) (increase(mytheus_agent_meeting_seconds_total[1h])) > 600
        for: 30m
        labels: { severity: warn }
        annotations:
          summary: "Workspace {{ $labels.org_id }}: agent spend {{ $value | printf \"%.2f\" }} USD per meeting-hour (budget 3.5)"

      - alert: NeverRecordLeakEval
        # The never-record red-team eval leaked with the CURRENT prompts. Exported by the eval
        # harness (mytheus-intelligence tests/evalkit/report.py) to a Pushgateway or a textfile
        # collector when one is configured; absent otherwise, and then this rule never fires.
        expr: max by (mode) (mytheus_eval_never_record_leaks{variant="current"}) > 0
        for: 0m
        labels: { severity: page }
        annotations:
          summary: "Never-record eval ({{ $labels.mode }}): {{ $value }} leak(s) with the current prompts; do not roll out"

      - alert: NeverRecordOutputCaught
        # An agent wrote about a never-record topic the window never named, and the runtime's
        # filter removed it. Nothing leaked, but the prompt's ground rule did not hold.
        expr: sum by (org_id) (increase(mytheus_agent_never_record_skips_total{stage="output"}[1h])) > 0
        for: 0m
        labels: { severity: warn }
        annotations:
          summary: "Workspace {{ $labels.org_id }}: {{ $value }} agent result(s) about a never-record topic were removed in the last hour"
