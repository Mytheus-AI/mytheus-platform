name: ci

# Canonical CI template for the Mytheus code repos (shift-left from day one:
# 16-deployment-and-infrastructure.md §5.2, system.md §9). Each code repo carries a thin copy of
# this that runs the jobs relevant to it. mytheus-ui is intentionally out of scope of this template
# (it owns its own Next.js CI). Secrets are never committed; the security job enforces it.

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  python:
    # Python repos: mytheus-backend, mytheus-intelligence, mytheus-events, transcription-service.
    # This repo has no pyproject.toml, so the steps are skipped here instead of failing `uv sync`.
    # (hashFiles() is not allowed in a job-level `if`, which makes the whole workflow invalid.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        if: hashFiles('pyproject.toml') != ''
      - run: uv sync
        if: hashFiles('pyproject.toml') != ''
      - run: uv run ruff check . && uv run black --check .
        if: hashFiles('pyproject.toml') != ''
      - run: uv run mypy .
        if: hashFiles('pyproject.toml') != ''
      - run: uv run pytest -q
        if: hashFiles('pyproject.toml') != ''

  authz-check:
    # Shift-left security: every FastAPI route must declare an auth dependency or be explicitly
    # public (11-security-architecture.md §3.2). Wired in the backend's copy of this workflow.
    if: contains(github.repository, 'mytheus-backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv run python scripts/check_authz.py

  avro-compat:
    # The BACKWARD compatibility gate. mytheus-events only.
    if: contains(github.repository, 'mytheus-events')
    runs-on: ubuntu-latest
    services:
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:latest
        ports:
          - "8081:8081"
    steps:
      - uses: actions/checkout@v4
      - run: make validate && make register && make check-compatibility

  observability:
    # Grafana dashboards (structure, datasource, variables) and the Prometheus config, alert rules
    # and promtool rule unit tests. mytheus-platform only.
    if: contains(github.repository, 'mytheus-platform')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-observability.sh

  postgres-hardening:
    # deploy/postgres-init/harden-roles.sql on the production image, both ways it runs
    # (journal plan Part 3 fixes 3/7): automatically on a NEW volume through the mounted
    # zz-mytheus-harden-roles.sh, and by the operator script on an existing database, twice
    # (it must be idempotent). Fails if any login other than postgres / supabase_admin still
    # bypasses isolation, or if the FTS operator is not leakproof.
    if: contains(github.repository, 'mytheus-platform')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fresh volume with the hardening mounted exactly as compose.prod.yml mounts it
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mytheus \
            -v "$PWD/deploy/postgres-init/zz-mytheus-harden-roles.sh:/docker-entrypoint-initdb.d/zz-mytheus-harden-roles.sh:ro" \
            -v "$PWD/deploy/postgres-init/harden-roles.sql:/etc/mytheus/harden-roles.sql:ro" \
            supabase/postgres:15.8.1.060
          for i in $(seq 1 90); do
            docker logs pg 2>&1 | grep -q "zz-mytheus-harden-roles.sh: hardening" \
              && docker exec pg pg_isready -U postgres -h localhost >/dev/null 2>&1 && break
            sleep 2
          done
          sleep 5
          docker logs pg 2>&1 | grep -A8 "zz-mytheus-harden-roles"
      - name: no login bypasses isolation, and @@ is leakproof
        run: |
          q() { docker exec -e PGPASSWORD=ci pg psql -h localhost -U supabase_admin -d mytheus -Atc "$1"; }
          bad=$(q "SELECT string_agg(rolname, ',') FROM pg_roles r WHERE rolcanlogin
                   AND rolname NOT IN ('postgres','supabase_admin')
                   AND (rolsuper OR rolbypassrls
                        OR pg_has_role(r.oid,'pg_read_all_data','MEMBER')
                        OR pg_has_role(r.oid,'pg_write_all_data','MEMBER')
                        OR EXISTS (SELECT 1 FROM pg_roles b WHERE b.oid <> r.oid
                                   AND (b.rolsuper OR b.rolbypassrls)
                                   AND pg_has_role(r.oid, b.oid, 'MEMBER')))")
          [ -z "$bad" ] || { echo "::error::logins that still bypass isolation: $bad"; exit 1; }
          [ "$(q "SELECT bool_and(proleakproof) FROM pg_proc WHERE proname IN ('ts_match_vq','ts_match_qv')")" = "t" ] \
            || { echo "::error::ts_match_vq/ts_match_qv are not LEAKPROOF"; exit 1; }
      - name: the operator script is idempotent on an existing database
        run: |
          deploy/postgres-init/harden-existing-db.sh pg > /tmp/run1.txt
          deploy/postgres-init/harden-existing-db.sh pg > /tmp/run2.txt
          cat /tmp/run1.txt
          diff /tmp/run1.txt /tmp/run2.txt
          grep -q "(0 rows)" /tmp/run1.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks BINARY is free; only the gitleaks-action wrapper needs a licence for
      # organisation-owned repos (same fix as mytheus-backend).
      - name: gitleaks (secret scan)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose
      - run: pip install pip-audit && pip-audit || true

  docker:
    # Build the deployable image so a broken Dockerfile fails the PR, not the deploy.
    if: contains(github.repository, 'mytheus-backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t "mytheus-backend:${GITHUB_SHA}" .
